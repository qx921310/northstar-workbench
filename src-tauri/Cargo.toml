[package]
name = "northstar-workbench"
version = "0.1.10"
description = "A local-first personal workbench"
authors = ["Northstar"]
edition = "2021"

[features]
dev-isolation = []

[lib]
name = "northstar_workbench_lib"
crate-type = ["cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
ammonia = "4.1.4"
base64 = "0.22"
fs2 = "0.4"
imap = "2.4.1"
keyring = { version = "3", features = ["windows-native"] }
mailparse = "0.16"
minisign-verify = "0.3"
native-tls = "0.2"
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = [] }
tauri-plugin-updater = "2"
url = "2"
zip = { version = "9", default-features = false, features = ["deflate"] }
